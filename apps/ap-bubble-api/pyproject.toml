[project]
name = "ap-bubble-api"
version = "0.1.0"
description = "Local HTTP API of ap-bubble, used by the web app."
requires-python = ">=3.13"
dependencies = [
    "ap-bubble-core",
    "fastapi>=0.162.0",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
ap-bubble-api = "bubble_api.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bubble_api"

[tool.uv.sources]
ap-bubble-core = { workspace = true }
