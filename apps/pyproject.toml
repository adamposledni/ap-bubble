# uv workspace root for all Python components of ap-bubble.
[tool.uv.workspace]
members = [
    "ap-bubble-api",
    "ap-bubble-core",
    "ap-bubble-ingest",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["bubble_*"]

[tool.pytest.ini_options]
testpaths = ["ap-bubble-*/tests"]
addopts = "--import-mode=importlib"
