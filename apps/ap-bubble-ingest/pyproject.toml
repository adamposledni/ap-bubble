[project]
name = "ap-bubble-ingest"
version = "0.1.0"
description = "L0 ingestion jobs and account connection for ap-bubble."
requires-python = ">=3.13"
dependencies = [
    "ap-bubble-core",
    "google-auth>=2.62.1",
    "google-auth-oauthlib>=1.5.0",
    "msal>=1.39.0",
    "requests>=2.34.2",
]

[project.scripts]
ap-bubble-ingest = "bubble_ingest.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bubble_ingest"

[tool.uv.sources]
ap-bubble-core = { workspace = true }
