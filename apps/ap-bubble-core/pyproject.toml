[project]
name = "ap-bubble-core"
version = "0.1.0"
description = "Shared paths, logging and vault storage for ap-bubble components."
requires-python = ">=3.13"
dependencies = [
    "keyring>=25.7.0",
    "python-dateutil>=4.0.0",
    "tzdata>=2026.6",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bubble_core"
